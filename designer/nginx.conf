server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy to the Fluxnova REST API: no CORS setup needed.
  location /engine-rest/ {
    proxy_pass http://fluxnova:8080/engine-rest/;
    proxy_set_header Host $host;
    client_max_body_size 20m;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
